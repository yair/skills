# Build the image, start it exactly as golem will, and only then publish it to
# GHCR. From the golem-apps skill; change HEALTH_PATH and APP_PORT if your app
# differs. A red run publishes nothing.
name: golem image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  HEALTH_PATH: /healthz
  APP_PORT: "8080"
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg VERSION=${{ github.sha }} -t candidate .
      - name: Smoke test as golem runs it
        run: |
          docker run -d --name candidate --user 54321:54321 --read-only \
            --tmpfs /tmp --tmpfs /data:uid=54321,gid=54321,mode=0700 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e PORT=$APP_PORT -p 127.0.0.1:18000:$APP_PORT candidate
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18000$HEALTH_PATH" >/dev/null; then echo healthy; exit 0; fi
            sleep 2
          done
          echo "not healthy after 60 s"; docker logs candidate; exit 1
      - name: Publish to GHCR
        run: |
          image=ghcr.io/$(echo "${{ github.repository }}" | tr 'A-Z' 'a-z')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag candidate "$image:${{ github.sha }}"
          docker tag candidate "$image:latest"
          docker push "$image:${{ github.sha }}"
          docker push "$image:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:${{ github.sha }}")
          echo "Published $digest" | tee -a "$GITHUB_STEP_SUMMARY"
